version: "3.8"

services:
  # 1. PostgreSQL Adatbázis (Csak ez fut a Dockerben)
  postgres:
    image: postgres:15-alpine
    container_name: devcoach-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: devcoach_db
      POSTGRES_HOST_AUTH_METHOD: trust # Jelszó nélküli megbízható helyi kapcsolat
    ports:
      - "5433:5432" # Kifelé a gépednek az 5433-as porton nyitja meg
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devcoach_db"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
