services:
  backend:
    build:
      context: ./backend
    container_name: devcoach-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT:-3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    networks:
      - devcoach-network
    depends_on:
      postgres:
        condition: service_healthy
    # Itt a javított, letisztított parancs:
    command: sh -c "npx prisma db push && npm run dev"

  frontend:
    build:
      context: ./frontend
    container_name: devcoach-frontend
    ports:
      - "5173:5173"
    networks:
      - devcoach-network
    depends_on:
      - backend

  # 1. PostgreSQL Adatbázis (Csak ez fut a Dockerben)
  postgres:
    image: postgres:15-alpine
    container_name: devcoach-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: devcoach_db
      POSTGRES_HOST_AUTH_METHOD: trust # Jelszó nélküli megbízható helyi kapcsolat
    ports:
      - "5433:5432" # Kifelé a gépednek az 5433-as porton nyitja meg
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devcoach_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - devcoach-network

volumes:
  pgdata:

networks:
  devcoach-network:
    driver: bridge
